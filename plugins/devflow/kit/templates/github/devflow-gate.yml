# Generated by devflow (/devflow:init --github): runs the same gate as `npm run check` on every pull request
# into __INTEGRATION__ — commitlint, hard rules, then the lint / build / test commands of each touched area of
# .devflow.json. Make the "devflow gate" check required (Settings → Branches → branch protection rule for
# __INTEGRATION__) so nothing merges red. Add project setup the area commands need (composer install,
# docker services, …) as steps before the gate.
name: devflow gate

on:
  pull_request:
    branches: [__INTEGRATION__]
  workflow_dispatch:

concurrency:
  group: devflow-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: devflow gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR branch itself (not GitHub's merge commit), with full history so the gate can diff and
          # lint commit messages against the base branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi

      - name: devflow gate
        run: node scripts/devflow/flow.mjs check --ci --base "origin/${{ github.base_ref || '__INTEGRATION__' }}"

      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devflow-logs
          path: .git/devflow-logs/
          if-no-files-found: ignore
